backend:
  name: git-gateway
  branch: main

media_folder: "works/uploads"
public_folder: "/works/uploads"

collections:
  - name: "site_data"
    label: "Site Data"
    files:
      - name: "works"
        label: "Works"
        file: "works/data.json"
        format: "json"
        fields:
          - label: "Works"
            name: "works"
            widget: "list"
            summary: "{{fields.number}} {{fields.date}} {{fields.title}}"
            hint: "上にある作品ほど /works/ の上に表示されます。新しく追加した作品は自動で上に入ります。古い作品を更新しても順番は変わりません。必要なときは手動で並び替えできます。"
            label_singular: "work"
            add_to_top: true
            allow_reorder: true
            collapsed: true
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "作品URLに使う半角ID。例: 20260601_new_work → /works/20260601_new_work/。公開後はなるべく変えないでください。" }
              - { label: "Number", name: "number", widget: "string", hint: "例: w/002" }
              - { label: "Date", name: "date", widget: "string", required: false, hint: "例: 20260601" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "文中リンクは [表示する文字](https://example.com) の形で書けます。" }
              - label: "Images"
                name: "images"
                widget: "list"
                field:
                  label: "Image"
                  name: "image"
                  widget: "image"
