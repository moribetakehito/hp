<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin - moribe takehito</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerEventListener({
      name: 'preSave',
      handler: async ({ entry }) => {
        let data = entry.get('data');
        const works = data && data.get ? data.get('works') : null;
        if (!works || typeof works.size !== 'number') return data;
        const dates = new Set();
        const normalized = works.map(work => {
          const day = work.get('date');
          if (typeof day !== 'string' || !/^\d{8}$/.test(day)) throw new Error('日付はYYYYMMDD形式の8桁で入力してください。');
          const parsed = new Date(`${day.slice(0,4)}-${day.slice(4,6)}-${day.slice(6,8)}T00:00:00Z`);
          if (!Number.isFinite(parsed.getTime()) || parsed.toISOString().slice(0,10).replaceAll('-','') !== day) throw new Error(`日付「${day}」は存在しません。`);
          if (dates.has(day)) throw new Error(`日付「${day}」が重複しています。`);
          dates.add(day);
          return work.set('id',day).delete('number').delete('url');
        }).sort((a,b) => b.get('date').localeCompare(a.get('date')));
        data = data.set('works',normalized);

        try {
          const response = await fetch(`/works/data.json?confirm=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) return data;

          const current = await response.json();
          const currentCount = Array.isArray(current.works) ? current.works.length : works.size;
          if (works.size < currentCount) {
            const ok = window.confirm(
              `Worksが ${currentCount} 件から ${works.size} 件に減っています。\n` +
              '作品を削除した状態で保存しますか？\n\n' +
              '間違えて消した場合は「キャンセル」を押してください。'
            );
            if (!ok) throw new Error('作品削除を含む保存をキャンセルしました。');
          }
        } catch (error) {
          if (error && error.message && error.message.includes('キャンセル')) throw error;
        }

        return data;
      },
    });
  </script>
</body>
</html>
