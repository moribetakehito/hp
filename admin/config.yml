backend:
  name: git-gateway
  branch: main

media_folder: "works/uploads"
public_folder: "/works/uploads"

collections:
  - name: "site_data"
    label: "Site Data"
    files:
      - name: "works"
        label: "Works"
        file: "works/data.json"
        format: "json"
        fields:
          - label: "Works"
            name: "works"
            widget: "list"
            summary: "{{fields.date}} {{fields.title}}"
            hint: "日付を作品IDとして使います。保存すると日付の新しい順に並びます。1日につき1作品を登録できます。"
            label_singular: "work"
            add_to_top: true
            allow_reorder: false
            collapsed: true
            fields:
              - { label: "日付", name: "date", widget: "string", pattern: ['^[0-9]{8}$', 'YYYYMMDD形式の8桁で入力してください。'], hint: "例: 20260601。作品IDとURLに使います。公開後に日付を変えるとURLも変わります。" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string", required: false }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "文中リンクは [表示する文字](https://example.com) の形で書けます。" }
              - label: "Images"
                name: "images"
                widget: "list"
                field:
                  label: "Image"
                  name: "image"
                  widget: "image"
